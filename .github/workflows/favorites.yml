name: Favorites backtest

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["requests/favorites"]     # first line "probe" = one month, 100 markets; anything else = all months

permissions:
  contents: write

concurrency:
  group: favorites
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          if head -1 requests/favorites | grep -q '^probe'; then
            echo 'matrix={"include":[{"month":"2026-09","limit":"100"}]}' >> "$GITHUB_OUTPUT"
          else
            M=$(python3 -c "import json;print(json.dumps({'include':[{'month':f'{y}-{m:02d}','limit':''} for y,m in [(2025,x) for x in range(7,13)]+[(2026,x) for x in range(1,11)]]}))")
            echo "matrix=$M" >> "$GITHUB_OUTPUT"
          fi

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 3                 # be polite to Polymarket's public API
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch this month
        timeout-minutes: 330
        run: python scripts/favorites_fetch.py ${{ matrix.month }} ${{ matrix.limit }}
      - name: Commit data (also after a failure, so progress is kept)
        if: always()
        run: |
          git config user.name "favorites bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favorites
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Favorites data ${{ matrix.month }} [skip ci]"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((RANDOM % 20 + 5))
          done
          exit 1

  backtest:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backtest
        run: python scripts/favorites_backtest.py | tee /tmp/msg.txt
      - name: Commit results
        run: |
          git config user.name "favorites bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favorites
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Favorites backtest results [skip ci]"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
      - name: Send one ntfy push (topic comes only from the NTFY_TOPIC secret)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC secret is not set; skipping"; exit 0; fi
          MSG="Favorites backtest finished: $(cat /tmp/msg.txt 2>/dev/null || echo 'no result')"
          curl -fsS -H "Title: Polymarket favorites backtest" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
