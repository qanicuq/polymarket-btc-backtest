name: Scheduled reminder

on:
  push:
    branches: [main]
    paths: ["requests/reminder"]   # line 1: unix time to deliver; line 2: link to open; rest: message

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hand the message to ntfy for delivery at the set time (topic only from the NTFY_TOPIC secret)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC secret is not set"; exit 1; fi
          AT=$(sed -n 1p requests/reminder)
          CLICK=$(sed -n 2p requests/reminder)
          MSG=$(sed -n '3,$p' requests/reminder)
          curl -fsS -H "At: $AT" -H "Title: Reminder" -H "Click: $CLICK" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          echo "Scheduled for $(date -u -d @$AT)"
