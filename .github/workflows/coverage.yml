name: Coverage scan

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["requests/coverage"]   # commit a new timestamp here to (re)start; finished hours are skipped

permissions:
  contents: write

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 4              # be polite to the free PMXT archive
      matrix:
        chunk:
          - {name: "01", start: "2026-04-01", end: "2026-05-06"}
          - {name: "02", start: "2026-05-07", end: "2026-05-29"}
          - {name: "03", start: "2026-05-30", end: "2026-06-21"}
          - {name: "04", start: "2026-06-22", end: "2026-07-14"}
          - {name: "05", start: "2026-07-15", end: "2026-08-06"}
          - {name: "06", start: "2026-08-07", end: "2026-08-29"}
          - {name: "07", start: "2026-08-30", end: "2026-09-21"}
          - {name: "08", start: "2026-09-22", end: "2026-10-15"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow
      - name: Scan this chunk
        timeout-minutes: 320
        run: python scripts/coverage.py ${{ matrix.chunk.start }} ${{ matrix.chunk.end }} ${{ matrix.chunk.name }}
      - name: Commit results (also after a failure or timeout, so progress is kept)
        if: always()
        run: |
          git config user.name "coverage bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Coverage results, chunk ${{ matrix.chunk.name }}"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((RANDOM % 20 + 5))
          done
          exit 1

  notify:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Send one ntfy summary (topic comes only from the NTFY_TOPIC secret)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          MSG=$(python3 - <<'EOF'
          import csv, glob
          rows = [r for f in glob.glob("coverage/coverage_*.csv") for r in csv.DictReader(open(f, newline=""))]
          files = sum(r["file"] == "yes" for r in rows)
          full = sum(r["windows_in_file"] == "12" for r in rows)
          part = sum(r["windows_in_file"] not in ("", "0", "12") for r in rows)
          errs = sum(r["note"].startswith(("ERR", "download error")) for r in rows)
          print(f"Coverage scan finished: {len(rows)} hours checked, {files} archive files, {full} hours with all 12 "
                f"BTC 5-min windows, {part} partial, {errs} errors.")
          EOF
          )
          echo "$MSG"
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC secret is not set; skipping the push"; exit 0; fi
          curl -fsS -H "Title: Polymarket backtest" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
